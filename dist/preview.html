<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8f2fb" />
    <meta name="description" content="Превью свадебного приглашения Бекзата и Алины" />
    <base href="/" />
    <title>Бекзат &amp; Алина — свадебное приглашение</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&family=Marck+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="assets/backgrounds/bg-01.webp" as="image" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      .preview-shell {
        height: 100svh;
      }
    </style>
  </head>
  <body class="intro-complete">
    <main class="site-shell preview-shell">
      <div class="background-strip" aria-hidden="true">
        <img
          src="assets/backgrounds/bg-01.webp"
          width="941"
          height="1672"
          alt=""
          decoding="async"
          fetchpriority="high"
        />
      </div>

      <section class="texture-panel texture-panel--one hero" aria-labelledby="previewNames">
        <img
          class="ornament ornament--hero-corner"
          src="assets/decorations/01-floral-corner.webp"
          width="640"
          height="618"
          alt=""
          decoding="async"
        />
        <img
          class="ornament ornament--hero-snow"
          src="assets/decorations/02-snowflake.webp"
          width="640"
          height="604"
          alt=""
          decoding="async"
        />

        <div class="hero__content">
          <p class="eyebrow">Приглашение на свадьбу</p>
          <h1 id="previewNames" class="hero__names">
            <span>Бекзат</span>
            <span class="hero__ampersand">&amp;</span>
            <span>Алина</span>
          </h1>
          <p class="hero__date">12.06.2027</p>
          <div class="fine-line" aria-hidden="true"><span>♥</span></div>
        </div>

        <div class="scroll-cue" aria-hidden="true"><span></span></div>
      </section>
    </main>
  </body>
</html>
